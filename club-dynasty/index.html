 btn(40,236,280,58,SV.car?'Continue career':'New career',()=>{if(SV.car){car=SV.car;mode='car';go('chub');}else go('cnew');},'#ffe066',24,SV.car?'Season '+SV.car.season+' · '+DIV[SV.car.clubs[SV.car.me].tier]:'Manage a club from League One');
 if(SV.car)btn(40,300,280,34,'New career (erases current)',()=>{SV.car=null;save();go('cnew');},'#ffcdd2',13);
 btn(40,344,136,42,'Customize',()=>go('custom'),'#fff',17);btn(184,344,136,42,'Shop',()=>go('shop'),'#fff',17);
 btn(40,394,136,40,'Level: '+DIFN[SV.dif],()=>{SV.dif=(SV.dif+1)%4;save();snd(500,.08,'triangle',.1);},'#fff',15);btn(184,394,64,40,'SFX',()=>{SV.snd=1-SV.snd;save();},SV.snd?'#69f0ae':'#cfd8dc',15);btn(256,394,64,40,'Music',()=>{SV.mus=1-SV.mus;save();},SV.mus?'#69f0ae':'#cfd8dc',14);
 G.text('Titles '+(SV.titles||0)+' · Seasons '+(SV.seasons||0)+' · Wins '+SV.wins,W/2,470,12,'#fff');G.text('All clubs and players are fictional',W/2,492,10,'#cfd8dc');}
function start(){scr='menu';LV=null;fade=10;}
function draw(){kFrame();if(kScreen()){kFade();return;}
 if(scr==='live'){drawLive();drawPanels();}else if(scr==='menu')drawMenu();else if(scr==='prematch')drawPrematch();else if(scr==='cnew')drawCnew();else if(scr==='chub')drawChub();else if(scr==='csquad')drawCsquad();else if(scr==='cmkt')drawCmkt();else if(scr==='cfac')drawCfac();else if(scr==='ctable')drawCtable();else if(scr==='cend')drawCend();
 kFade();}
return{start,update,draw,score:()=>fs,down(p){if(p.x==null)return;kHit(p);},move(p){if(p.x!=null){mx=p.x;my=p.y;}},up(){},
 dbg:()=>({scr,st:LV&&LV.st,car:car&&[car.ci,car.season,car.cash,car.conf,car.squad.length]}),
 skip(){if(LV&&LV.st==='play'){for(let i=0;i<4000&&LV&&LV.st!=='end'&&LV.st!=='pens'&&LV.st!=='ht';i++)update();if(LV&&LV.st==='ht')LV.st='play';}}};
})();

function begin(){$('ov').hidden=true;state='play';G.t=0;game.start();try{window.PokiSDK&&PokiSDK.gameplayStart&&PokiSDK.gameplayStart();}catch(e){}}
function retry(){const f=()=>begin();try{if(window.PokiSDK&&PokiSDK.commercialBreak){PokiSDK.commercialBreak().then(f,f);return;}}catch(e){}f();}
$('b').onclick=()=>state==='over'?retry():begin();
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play')game.down(pos(e));});
cv.addEventListener('pointermove',e=>{if(state==='play'&&game.move)game.move(pos(e));});
addEventListener('pointerup',e=>{if(state==='play'&&game.up)game.up(pos(e));});
addEventListener('keydown',e=>{
 if(e.repeat&&e.code==='Space')return;
 if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play')begin();else game.down({x:null});}
 if(state==='play'&&game.key){if(e.code==='ArrowLeft'||e.code==='KeyA')game.key(-1);if(e.code==='ArrowRight'||e.code==='KeyD')game.key(1);}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&state==='play'&&game.up)game.up({x:null});});
game.start();
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;
 while(acc>=1000/60){if(state==='play'){G.t++;game.update();}acc-=1000/60;}
 ctx.setTransform(k,0,0,k,0,0);game.draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
setTimeout(()=>$('b').focus(),100);
window.__g={game,get state(){return state}};
})();
